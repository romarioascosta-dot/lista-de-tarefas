<!doctype html>
<html lang="pt-br"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="list.css">
    <title>Treino</title>
  </head>
  <body>
    <div>
      <h1 class="title">Tarefas do dia 28 de julho de 2026</h1>
      <ul id="list"></ul>
    </div>
    <div>
      <label for="task_text" class="visually-hidden">Nome da tarefa</label>
      <input type="text" id="task_text" name="task_name" placeholder="nome da Tarefa">
      <button id="add_button" class="add-task-button">Adicionar</button>
      <button id="reset_button" class="reset-button">Reiniciar lista</button>
    </div>
    <script src="list.js" defer=""></script>
  

</body></html>
